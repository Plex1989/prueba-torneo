<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripciones</title>
    <!-- Esto crea la variable global 'supabase' -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px;">
    <h2>Conexión Vercel - Supabase</h2>
    <div id="lista-jugadores">Cargando...</div>

    <script>
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        
        // Le cambiamos el nombre a 'clienteSupabase' para que no choque
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function cargarJugadores() {
            // Usamos 'clienteSupabase' aquí también
            const { data, error } = await clienteSupabase.from('jugadores').select('*');
            
            if (error) {
                document.getElementById('lista-jugadores').innerHTML = "Error de conexión RLS.";
                return;
            }
            if (!data || data.length === 0) {
                document.getElementById('lista-jugadores').innerHTML = "Conectado. Pero la tabla está bloqueada por RLS o está vacía.";
                return;
            }
            
            let html = "<ul>";
            data.forEach(j => html += `<li>${j.nombre} - ${j.puntos_ranking} pts</li>`);
            html += "</ul>";
            document.getElementById('lista-jugadores').innerHTML = html;
        }
        cargarJugadores();
    </script>
</body>
</html>
